name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/cli
      - run: npm test
      - run: node --test tests/*.test.mjs
        env:
          DB_DRIVER: libsql
          TEST_S3: "1"
      - run: npm run test:load
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-check.mjs
      - run: node scripts/public-conversation-check.mjs
      - run: node scripts/workspace-preview-check.mjs
      - run: node scripts/workspace-browser-check.mjs
      - run: node scripts/review-flow-browser-check.mjs
      - run: node scripts/rooms-browser-check.mjs
      - run: node scripts/contributions-browser-check.mjs
      - run: node scripts/github-app-browser-check.mjs
      - run: node scripts/github-work-browser-check.mjs
      - run: node scripts/security-browser-check.mjs
      - run: node scripts/my-work-browser-check.mjs
      - run: node scripts/participation-browser-check.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: |
            .test-data/browser/
            .test-data/workspaces-preview/
            .test-data/workspaces-browser/
            .test-data/review-flow-browser/
            .test-data/rooms-browser/
            .test-data/contributions-browser/
            .test-data/github-app-browser/
            .test-data/github-work-browser/
            .test-data/security-browser/
            .test-data/my-work-browser/
            .test-data/participation-browser/
          retention-days: 7
