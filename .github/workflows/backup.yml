name: Encrypted backup and restore check
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      workspace_action:
        description: 'After verified backup: prepare or finalize the Workspaces rollout'
        type: choice
        required: true
        default: none
        options:
          - none
          - prepare
          - finalize
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPLOAD_DRIVER: s3
      BACKUP_MAX_BYTES: '52428800'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Dependency installation and artifact publication do not need the
      # production database credentials or the backup decryption key.
      - run: npm ci
      - name: Clean expired records, snapshot, encrypt and verify restoration
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          WORKSPACE_ACTION: ${{ inputs.workspace_action || 'none' }}
        run: |
          node -e 'for (const k of ["TURSO_DATABASE_URL","TURSO_AUTH_TOKEN","S3_ENDPOINT","S3_BUCKET","S3_ACCESS_KEY_ID","S3_SECRET_ACCESS_KEY","BACKUP_ENCRYPTION_KEY"]) if (!process.env[k]) throw Error("Missing GitHub Actions secret " + k)'
          # The pre-migration release must be backed up without requiring the new schema.
          if [ "$WORKSPACE_ACTION" = "none" ]; then npm run maintenance; fi
          npm run backup -- create backups/nightly.ddb
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-production-backup-${{ github.run_id }}
          path: backups/nightly.ddb
          if-no-files-found: error
          retention-days: 7
      # Manual rollout actions run only after the encrypted archive is verified
      # and uploaded. Daily backups never perform schema migrations.
      - name: Prepare additive Workspaces schema
        if: github.event_name == 'workflow_dispatch' && inputs.workspace_action == 'prepare'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/migrate.mjs --prepare-workspaces
      - name: Finalize schema after production health check
        if: github.event_name == 'workflow_dispatch' && inputs.workspace_action == 'finalize'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module -e 'const r = await fetch("https://devdevian.vercel.app/api/health", {signal: AbortSignal.timeout(20000)}); if (!r.ok || (await r.json()).version !== "0.2.0") throw Error("Production 0.2.0 must be healthy before finalization")'
          node scripts/migrate.mjs
